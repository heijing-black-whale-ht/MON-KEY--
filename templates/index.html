<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <!--<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="min-h-screen bg-[#fafafa] pb-24 font-sans text-[#333] font-light leading-[1.6] tracking-[-0.02em]">


<header class="mx-auto flex max-w-[1200px] items-center justify-between bg-white px-8 py-2.5 shadow-[0_2px_10px_rgba(0,0,0,0.05)]">
    <div class="flex items-center">
        <a href="{{ url_for('index') }}" class="block h-[50px]">
            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="Logo"
                class="block h-[50px] w-auto object-contain"
            >
        </a>
    </div>

    <nav class="nav-menu">
        <ul class="flex list-none items-center gap-5 font-serif">
            <li>
                <a
                    href="{{ url_for('index') }}"
                    class="font-bold text-[#0f0b0a] no-underline"
                >
                    Home
                </a>
            </li>
        </ul>
    </nav>

    <div class="flex cursor-pointer items-center gap-[15px] text-[1.1rem] text-gray-700">
        <i class="fas fa-search"></i>
        <i id="hamburger" class="fas fa-bars"></i>
    </div>
</header>

    <main>
      <div class="mx-auto my-10 w-full max-w-3xl px-4 pb-16 sm:px-8">  
        <h1 class="mb-5 text-2xl font-semibold tracking-tight text-gray-800">
            My Tasks
        </h1>
        <h2>You have {{ pending_count }} 
            {% if pending_count == 1 %}
                pending task
            {% else %}
                pending tasks
            {% endif %}
        </h2>

        <!-- Add task form-->

<form action="/add" method="POST" class="mb-16 flex gap-3">
    <input
        type="text"
        name="title"
        placeholder="Add a new task..."
        required
        class="box-border h-12 min-w-0 flex-1 rounded-md border border-gray-300 bg-white px-4 py-2.5 text-base text-gray-800 outline-none transition focus:border-gray-500 focus:ring-2 focus:ring-gray-200"
    >

    <button
        type="submit"
        class="box-border shrink-0 rounded-md bg-gray-800 px-5 py-2.5 font-medium text-white transition-colors hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2"
    >
        Add
    </button>
</form>


<!-- Task list -->
<ul class="mt-4 flex list-none flex-col gap-3 p-0">
    {% for task in tasks %}
        <li class="flex items-center gap-4 rounded-md border border-gray-200 bg-white px-4 py-3.5 shadow-sm">

            <label class="toggle-switch">
                <input
                    type="checkbox"
                    {% if task['done'] == 1 %}checked{% endif %}
                    onclick="window.location.href='/complete/{{ task['id'] }}'"
                >
                <span class="slider"></span>
            </label>

            <span class="min-w-0 flex-1 text-base text-gray-800 transition-colors {% if task['done'] == 1 %}text-gray-400 line-through{% endif %}">
                {{ task['title'] }}
            </span>

            <a
                href="/delete/{{ task['id'] }}"
                class="ml-auto shrink-0 rounded px-2 py-1 text-sm font-medium text-red-500 no-underline transition-opacity hover:opacity-70"
            >
                Delete
            </a>

        </li>
    {% endfor %}
</ul>
      </div>
    </main>


    <footer class="fixed inset-x-0 bottom-0 border-t border-gray-200 bg-white px-5 py-2 text-center text-sm text-gray-500">
        <p>&copy; 2026, TODO-APP. All Rights Reserved.</p>
    </footer>
    <!--<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>-->
</body>
</html>
